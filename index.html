<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groove — deep cuts, wide grooves</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Righteous&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Warm up connections to the APIs we're about to call, so the
         first real request doesn't pay the DNS/TLS handshake cost. -->
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://www.googleapis.com" />
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />

    <style>
      /* Static boot loader — plain CSS only, no framework dependency,
         so it paints immediately while the JS bundle is still downloading
         and parsing. Removed once React has mounted (see main.jsx). */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #1f1f1f;
        transition: opacity 0.25s ease;
      }
      #boot-loader.boot-loader-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-loader .ring {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 4px solid #3b3b3b;
        border-top-color: #3b96ff;
        animation: boot-spin 0.85s linear infinite;
      }
      #boot-loader .wordmark {
        font-family: "Righteous", system-ui, sans-serif;
        font-size: 20px;
        color: #f5f5f5;
      }
      #boot-loader .subtext {
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        font-size: 12px;
        color: #a6a6a6;
      }
      #boot-loader .retry {
        margin-top: 6px;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        color: #3b96ff;
        background: transparent;
        border: 1px solid #3b3b3b;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
        display: none;
      }
      #boot-loader.boot-loader-stuck .retry {
        display: inline-block;
      }
      #boot-loader.boot-loader-stuck .subtext {
        max-width: 280px;
        text-align: center;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-ink">
    <div id="boot-loader">
      <div class="ring"></div>
      <span class="wordmark">Groove</span>
      <span class="subtext">Getting things ready&hellip;</span>
      <button class="retry" onclick="location.reload()">Reload</button>
    </div>
    <div id="root"></div>
    <script>
      // Safety net: if the app bundle fails to load or throws before it
      // can remove #boot-loader, don't leave people staring at an
      // infinite spinner with no explanation — surface it after a bit.
      window.addEventListener("error", function () {
        var el = document.getElementById("boot-loader");
        if (el) {
          el.querySelector(".subtext").textContent =
            "Something went wrong loading the app.";
          el.classList.add("boot-loader-stuck");
        }
      });
      setTimeout(function () {
        var el = document.getElementById("boot-loader");
        if (el && !el.classList.contains("boot-loader-hidden")) {
          el.querySelector(".subtext").textContent =
            "This is taking longer than expected.";
          el.classList.add("boot-loader-stuck");
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
